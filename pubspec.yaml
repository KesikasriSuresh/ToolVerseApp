name: toolverse
description: A community-powered borrow & lend platform for tools, gadgets and equipment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  firebase_storage: ^12.3.4
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
